spring:
  cloud:
    gateway:
      routes:
        - id: uploads-service
          uri: http://trip-service:8082
          predicates:
            - Path=/uploads/**
          filters:
            - StripPrefix=0

        - id: super-admin-service
          uri: http://trip-service:8082
          predicates:
            - Path=/api/super/**
          filters:
            - StripPrefix=0

        - id: tenant-service
          uri: http://trip-service:8082
          predicates:
            - Path=/api/tenants/**
          filters:
            - StripPrefix=0

        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        - id: trip-service
          uri: http://trip-service:8082
          predicates:
            - Path=/api/trips/**
          filters:
            - StripPrefix=0
            - Auth

        - id: ai-service
          uri: http://ai-service:8083
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=0
