spring:
  cloud:
    gateway:
      routes:
        - id: uploads-service
          uri: http://trip-service:8082
          predicates:
            - Path=/uploads/**
          filters:
            - StripPrefix=0

        - id: super-admin-service
          uri: http://trip-service:8082
          predicates:
            - Path=/api/super/**
          filters:
            - StripPrefix=0

        - id: tenant-service
          uri: http://trip-service:8082
          predicates:
            - Path=/api/tenants/**
          filters:
            - StripPrefix=0

        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        - id: trip-service
          uri: http://trip-service:8082
          predicates:
            - Path=/api/trips/**
          filters:
            - StripPrefix=0
            - Auth

        - id: ai-service
          uri: http://ai-service:8083
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=0

        - id: user-service-api-docs
          uri: http://user-service:8081
          predicates:
            - Path=/user-service/v3/api-docs/**
          filters:
            - StripPrefix=1

        - id: trip-service-api-docs
          uri: http://trip-service:8082
          predicates:
            - Path=/trip-service/v3/api-docs/**
          filters:
            - StripPrefix=1

        - id: ai-service-api-docs
          uri: http://ai-service:8083
          predicates:
            - Path=/ai-service/v3/api-docs/**
          filters:
            - StripPrefix=1

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /user-service/v3/api-docs
      - name: Trip Service
        url: /trip-service/v3/api-docs
      - name: AI Service
        url: /ai-service/v3/api-docs
