server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: uploads-avatars
          uri: http://localhost:8081
          predicates:
            - Path=/uploads/avatars/**
          filters:
            - StripPrefix=0

        - id: uploads-service
          uri: http://localhost:8082
          predicates:
            - Path=/uploads/**
          filters:
            - StripPrefix=0

        - id: super-admin-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/super/**
          filters:
            - StripPrefix=0

        - id: tenant-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/tenants/**
          filters:
            - StripPrefix=0

        - id: user-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0
            - Tenant

        - id: user-profile
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=0
            - Tenant
            - Auth

        - id: trip-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/trips/**
          filters:
            - StripPrefix=0
            - Tenant
            - Auth

        - id: ai-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=0
            - Tenant

        - id: user-service-api-docs
          uri: http://localhost:8081
          predicates:
            - Path=/user-service/v3/api-docs/**
          filters:
            - StripPrefix=1

        - id: trip-service-api-docs
          uri: http://localhost:8082
          predicates:
            - Path=/trip-service/v3/api-docs/**
          filters:
            - StripPrefix=1

        - id: ai-service-api-docs
          uri: http://localhost:8083
          predicates:
            - Path=/ai-service/v3/api-docs/**
          filters:
            - StripPrefix=1

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin

  main:
    web-application-type: reactive

app:
  jwt:
    secret: 5267556B58703273357638792F423F4528482B4D6251655368566D5971337436

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /user-service/v3/api-docs
      - name: Trip Service
        url: /trip-service/v3/api-docs
      - name: AI Service
        url: /ai-service/v3/api-docs
